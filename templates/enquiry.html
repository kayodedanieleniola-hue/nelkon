<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Send Nakconel an enquiry about your brand, software, or digital project.">
  <title>Enquire | Nakconel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ground: #0A0202;
      --bronze: #C99A4A;
      --bronze-light: #E8C57A;
      --cream: #F5E8C7;
      --white: #FDFAF4;
      --muted: rgba(245,232,199,.65);
      --border: rgba(201,154,74,.22);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 20px 64px;
      color: var(--white);
      font: 14px/1.6 Poppins, sans-serif;
      background: radial-gradient(circle at 50% -12%, #751008 0, #300300 43%, var(--ground) 100%);
    }
    .page { width: min(100%, 720px); margin: auto; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 36px; }
    .logo { display: block; width: 140px; }
    .back { color: var(--cream); text-decoration: none; font-size: 13px; }
    .back:hover { color: var(--bronze-light); }
    .intro { max-width: 580px; margin: 0 auto 28px; text-align: center; }
    .eyebrow { margin: 0 0 8px; color: var(--bronze); font-size: 11px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; }
    h1 { margin: 0 0 10px; color: var(--cream); font: 600 clamp(30px, 5vw, 42px)/1.15 Fraunces, serif; }
    .intro p { margin: 0; color: var(--muted); font-size: 14px; }
    .card {
      padding: clamp(24px, 5vw, 40px);
      border: 1px solid var(--border);
      border-radius: 20px;
      background: linear-gradient(160deg, rgba(27,4,4,.85), rgba(10,2,2,.95));
      box-shadow: 0 30px 70px rgba(0,0,0,.5);
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .field { margin-bottom: 18px; }
    label { display: block; margin-bottom: 7px; color: var(--bronze); font-size: 11px; font-weight: 600; letter-spacing: .7px; text-transform: uppercase; }
    input, select, textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: 0;
      color: var(--white);
      background: rgba(245,232,199,.055);
      font: 14px Poppins, sans-serif;
      transition: .2s;
    }
    select option { background: #1B0404; color: var(--white); }
    textarea { min-height: 110px; resize: vertical; }
    input::placeholder, textarea::placeholder { color: rgba(245,232,199,.38); }
    input:focus, select:focus, textarea:focus {
      border-color: var(--bronze);
      box-shadow: 0 0 0 3px rgba(201,154,74,.12);
    }
    .file-note, .note { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
    .note { margin: 20px 0 16px; text-align: center; }
    button {
      width: 100%;
      padding: 14px 20px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      color: #1b0d05;
      background: linear-gradient(135deg, var(--bronze-light), var(--bronze));
      font: 700 14px Poppins, sans-serif;
      transition: .2s;
    }
    button:hover { filter: brightness(1.06); transform: translateY(-1px); }
    button:disabled { cursor: wait; opacity: .7; transform: none; }
    .status { display: none; margin: 16px 0 0; text-align: center; font-size: 13px; }
    .status.show { display: block; }
    .status.error { color: #ff9d91; }
    .status.success { color: var(--bronze-light); }
    @media (max-width: 600px) {
      body { padding: 18px 12px 40px; }
      .grid { grid-template-columns: 1fr; }
      .card { padding: 22px 16px; border-radius: 16px; }
      input, select, textarea { font-size: 15px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="top">
      <a href="/" aria-label="Nakconel home"><img class="logo" src="/static/image/logo.png" alt="Nakconel"></a>
      <a class="back" href="/">Back to home</a>
    </div>

    <section class="intro">
      <h1>Start Your Project Brief</h1>
      <p>Fill in a few quick details below. Our team will review your project and get back to you within 24 hours.</p>
    </section>

    <section class="card">
      <form id="enquiryForm">
        <div class="grid">
          <div class="field">
            <label for="brand_name">Your Name or Company Name *</label>
            <input id="brand_name" name="brand_name" required placeholder="e.g. Jane Doe / Acro Ltd">
          </div>
          <div class="field">
            <label for="brand_email">Email Address *</label>
            <input id="brand_email" name="brand_email" type="email" required placeholder="you@yourbrand.com">
          </div>
        </div>

        <div class="grid">
          <div class="field">
            <label for="phone">Phone / WhatsApp Number</label>
            <input id="phone" name="phone" type="tel" placeholder="+234 800 000 0000">
          </div>
          <div class="field">
            <label for="service_type">Service Needed *</label>
            <select id="service_type" name="service_type" required>
              <option value="">Select a service</option>
              <option value="Brand Strategy & Logo Design">Brand Strategy & Logo Design</option>
              <option value="Custom Web Development">Custom Web Development</option>
              <option value="Mobile App Development">Mobile App Development</option>
              <option value="AI Solutions & Automations">AI Solutions & Automations</option>
              <option value="Product & Project Management">Product & Project Management</option>
              <option value="Digital Marketing & Campaigns">Digital Marketing & Campaigns</option>
              <option value="Full Agency Suite">Full Agency Suite</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="project_message">Project Brief & Details *</label>
          <textarea id="project_message" name="project_message" required placeholder="Tell us about your project goals, key features, target timeline, or estimated budget..."></textarea>
        </div>

        <div class="field">
          <label for="supporting_files">Attach File / Design Brief <span style="text-transform:none; font-weight:400; color:var(--muted);">(Optional)</span></label>
          <input id="supporting_files" name="supporting_files" type="file" multiple>
          <p class="file-note">Upload up to 6 files (Max 5MB each).</p>
        </div>

        <p class="note">Your details are kept confidential and used only to respond to your project request.</p>

        <button id="submitButton" type="submit">Send Project Brief</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <style>
    .top { display: none; }
    .site-nav { position: sticky; top: 0; z-index: 20; margin: -32px -20px 34px; padding: 0 20px; background: rgba(10,2,2,.92); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); }
    .site-nav-inner { width: min(100%,1320px); min-height: 68px; margin: auto; display:flex; align-items:center; justify-content:space-between; gap:24px; }
    .site-nav-logo img { display:block; width:66px; height:auto; }
    .site-nav-links { display:flex; align-items:center; gap:23px; margin:0; padding:0; list-style:none; }
    .site-nav-links a { color:var(--cream); text-decoration:none; font-size:13px; white-space:nowrap; }
    .site-nav-links a:hover, .site-nav-links .nav-current { color:var(--bronze-light); }
    .site-nav-actions { display:flex; align-items:center; gap:12px; }
    .site-sign-in { padding:8px 14px; border:1px solid var(--border); border-radius:8px; color:var(--cream); text-decoration:none; font-size:13px; }
    .site-menu { display:none; width:40px; height:38px; border:1px solid var(--border); border-radius:8px; background:transparent; padding:8px; }
    .site-menu span { display:block; height:2px; margin:4px 0; background:var(--bronze-light); }
    .site-nav { position:fixed; left:0; width:100%; margin:0; }
    .site-nav + .page { padding-top:92px; }
    .site-nav-links { gap:32px; }
    .site-nav-links a { color:var(--muted); font-size:16px; font-weight:500; letter-spacing:.5px; }
    .site-sign-in { background:linear-gradient(135deg,var(--bronze),#8B6A2E); color:#1B0404; border:0; border-radius:8px; font-weight:600; padding:9px 20px; }
    .site-nav .about-item { position:relative; }
    .site-nav .about-trigger { color:var(--muted); font:500 16px var(--enquiry-font); letter-spacing:.5px; background:transparent; border:0; padding:0; cursor:pointer; }
    .site-nav .about-menu { display:none; position:absolute; top:28px; left:-18px; width:220px; padding:8px; border:1px solid rgba(201,154,74,.25); border-radius:14px; background:linear-gradient(160deg,rgba(27,4,4,.98),rgba(10,2,2,.99)); box-shadow:0 20px 50px rgba(0,0,0,.7); }
    .site-nav .about-item.open .about-menu { display:block; }
    .site-nav .about-menu a { display:block; padding:9px 10px; color:var(--cream); font-size:13px; letter-spacing:0; }
    .site-nav .about-menu a:hover { background:rgba(201,154,74,.1); border-radius:8px; }
    .site-footer { margin:72px -20px -64px; padding:52px 20px 20px; border-top:1px solid var(--border); background:linear-gradient(180deg,rgba(27,4,4,.65),#0A0202); }
    .site-footer-main { width:min(100%,1320px); margin:auto; display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:42px; }
    .site-footer-logo { display:block; width:104px; margin-bottom:14px; }
    .site-footer-desc { max-width:330px; margin:0 0 14px; color:var(--muted); font-size:13px; }
    .site-footer-email { color:var(--bronze-light); text-decoration:none; font-size:13px; }
    .site-footer-col h5 { margin:0 0 14px; color:var(--cream); font-size:13px; letter-spacing:.4px; }
    .site-footer-col ul { margin:0; padding:0; list-style:none; }.site-footer-col li { margin:0 0 9px; }
    .site-footer-col a { color:var(--muted); text-decoration:none; font-size:13px; }.site-footer-col a:hover { color:var(--bronze-light); }
    .site-footer-bottom { width:min(100%,1320px); margin:42px auto 0; padding-top:18px; border-top:1px solid var(--border); display:flex; justify-content:space-between; gap:20px; color:var(--muted); font-size:11px; }
    :root { --enquiry-font: 'Agrandir', Poppins, sans-serif; }
    body, input, select, textarea, button { font-family: var(--enquiry-font); }
    h1 { font-family: var(--enquiry-font); }
    .logo { width: 112px; height: auto; }
    @media (max-width: 600px) {
      body { padding: 18px 12px 40px; }
      .top { gap: 12px; margin-bottom: 28px; }
      .logo { width: 92px; }
      .back { font-size: 12px; }
      .intro { margin-bottom: 22px; }
      .intro h1 { font-size: clamp(28px, 9vw, 36px); }
      .card { padding: 22px 16px; border-radius: 16px; }
      input, select, textarea { font-size: 15px; }
      .site-nav { margin:-18px -12px 26px; padding:0 12px; }
      .site-nav { margin:0; }
      .site-nav + .page { padding-top:80px; }
      .site-nav-inner { min-height:60px; }
      .site-nav-logo img { width:58px; }
      .site-sign-in { padding:7px 10px; font-size:12px; }
      .site-menu { display:block; }
      .site-nav-links { display:none; position:absolute; top:60px; left:0; right:0; padding:14px 18px 18px; border-bottom:1px solid var(--border); background:rgba(10,2,2,.98); flex-direction:column; align-items:stretch; gap:4px; }
      .site-nav-links.open { display:flex; }
      .site-nav-links a { display:block; padding:10px 4px; }
      .site-nav .about-menu { position:static; width:auto; margin-top:8px; box-shadow:none; }
      .site-nav .about-trigger { font-size:16px; color:var(--muted); }
      .site-footer { margin:52px -12px -40px; padding:38px 16px 18px; }
      .site-footer-main { grid-template-columns:1fr 1fr; gap:30px 22px; }
      .site-footer-main > :first-child { grid-column:span 2; }
      .site-footer-logo { width:90px; }.site-footer-bottom { margin-top:30px; flex-direction:column; gap:5px; }
    }
  </style>

  <script>
    document.body.insertAdjacentHTML('afterbegin', `<header class="site-nav"><div class="site-nav-inner"><a class="site-nav-logo" href="/"><img src="/static/image/logo.png" alt="Nakconel"></a><ul class="site-nav-links" id="siteNavLinks"><li><a href="/home">Home</a></li><li><a href="/about">About</a></li><li><a href="/home#services">Pillars</a></li><li><a href="/home#work">Showcase</a></li><li><a href="/career">Career</a></li><li><a href="/home#contact">Contact</a></li><li><a class="nav-current" href="/enquiry">Enquire</a></li></ul><div class="site-nav-actions"><a class="site-sign-in" href="/login">Sign In</a><button class="site-menu" id="siteMenu" type="button" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button></div></div></header>`);
    const aboutLink = document.querySelector('#siteNavLinks a[href="/about"]');
    if (aboutLink) {
      aboutLink.parentElement.outerHTML = `<li class="about-item"><button class="about-trigger" id="aboutTrigger" type="button" aria-expanded="false">About</button><div class="about-menu" id="aboutMenu"><a href="/about">About Nakconel</a><a href="/meet-the-team">Meet the Team</a><a href="/about#vision-mission">Vision & Mission</a><a href="/voice">Brand Voice</a></div></li>`;
      document.getElementById('aboutTrigger').addEventListener('click', () => { const item = document.querySelector('.about-item'); const open = item.classList.toggle('open'); document.getElementById('aboutTrigger').setAttribute('aria-expanded', String(open)); });
    }
    document.getElementById('siteMenu').addEventListener('click', () => { const links = document.getElementById('siteNavLinks'); const open = links.classList.toggle('open'); document.getElementById('siteMenu').setAttribute('aria-expanded', String(open)); });
    document.body.insertAdjacentHTML('beforeend', `<footer class="site-footer"><div class="site-footer-main"><div><a href="/"><img class="site-footer-logo" src="/static/image/logo.png" alt="Nakconel"></a><p class="site-footer-desc">Combining brand strategy, content design, and enterprise technology with deep cultural intelligence.</p><a class="site-footer-email" href="mailto:nakconelcompany@gmail.com">nakconelcompany@gmail.com</a></div><div class="site-footer-col"><h5>Pillars</h5><ul><li><a href="/home#services">Brand Strategy</a></li><li><a href="/home#services">Content & Design</a></li><li><a href="/home#services">IT & Tech Systems</a></li></ul></div><div class="site-footer-col"><h5>Enablement</h5><ul><li><a href="/about">About Identity</a></li><li><a href="/home#contact">Strategy Support Desk</a></li></ul></div><div class="site-footer-col"><h5>Footprints</h5><ul><li><a href="/home#markets">Africa & Gulf Regions</a></li><li><a href="/home#markets">United States & Australia</a></li></ul></div></div><div class="site-footer-bottom"><span>© 2026 NAKCONEL Studio Inc. All rights reserved.</span><span>Culture gives meaning. Intelligence gives movement.</span></div></footer>`);

    const form = document.getElementById('enquiryForm');
    const button = document.getElementById('submitButton');
    const status = document.getElementById('status');

    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!form.reportValidity()) return;

      const data = new FormData(form);
      const name = data.get('brand_name');
      const email = data.get('brand_email');
      const phone = data.get('phone');
      const service = data.get('service_type');
      const details = data.get('project_message');

      const messageContent = `Service Requested: ${service}\nPhone / WhatsApp: ${phone || 'Not provided'}\n\nProject Brief:\n${details}`;

      const upload = new FormData();
      upload.append('payload', JSON.stringify({
        name: name,
        email: email,
        message: messageContent
      }));

      const fileInput = document.getElementById('supporting_files');
      if (fileInput && fileInput.files.length) {
        for (const file of fileInput.files) {
          upload.append('attachments', file);
        }
      }

      button.disabled = true;
      button.textContent = 'Sending...';
      status.className = 'status';

      try {
        const response = await fetch('/api/enquiry', { method: 'POST', body: upload });
        const result = await response.json();
        if (!response.ok || !result.saved) throw new Error(result.error || 'Unable to send your enquiry.');
        form.reset();
        status.textContent = 'Thank you! Your project brief has been received. We will contact you soon.';
        status.className = 'status show success';
      } catch (error) {
        status.textContent = error.message || 'Something went wrong. Please try again.';
        status.className = 'status show error';
      } finally {
        button.disabled = false;
        button.textContent = 'Send Project Brief';
      }
    });
  </script>
</body>
</html>
